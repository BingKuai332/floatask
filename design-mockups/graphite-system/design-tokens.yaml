version: 1.4.3
updated: 2026-10-31
owner: FloatAsk design system
usage: 唯一机器可读设计 token 源；实现与设计生成脚本均不得另建平行色板。
themeIds:
  light: 朝日 · 白天
  dark: 近月 · 深夜
  system: 跟随系统
fonts:
  latin: Liter
  cjk: MiSans
  code: 等宽字体
radius:
  window: 16
  container: 12
  control: 10
  small: 8
  media: 9
  compact: 7
  mini: 5
  pill: pill
spacing:
  unit: 4
  windowPadding: 24
  containerPadding: 24
  controlGap: 8
  sectionGap: 32
  floatingGap: 12
themes:
  dark:
    label: 近月 · 深夜
    colors:
      bg: "#0C0E12"
      surface: "#171A20"
      surface2: "#1D2128"
      surface3: "#242931"
