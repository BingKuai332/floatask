      accentSoft: "#28333F"
      green: "#8DB9A4"
      red: "#E1A0A8"
      redSoft: "#2C2025"
      primaryButton: "#E8EBF0"
      onPrimary: "#171A20"
      overlay: "#06080BB8"
    borders:
      floating: {width: 1, color: "#FFFFFF26"}
      control: {width: 1, color: "#FFFFFF1A"}
      active: {width: 1, color: "#8FA6C999"}
      danger: {width: 1, color: "#E1A0A84D"}
    shadows:
      floating: {blur: 38, color: "#00000066", offset: [0, 14]}
      toolbar: {blur: 26, color: "#00000077", offset: [0, 10]}
  light:
    label: 朝日 · 白天
    colors:
      bg: "#E7E7DF"
      surface: "#F4F3ED"
      surface2: "#FAF9F4"
      surface3: "#E9EBE4"
      divider: "#D6D9D0"
      text: "#20242B"
      body: "#3F4650"
